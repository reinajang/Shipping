<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해외배송 요금 비교</title>
<style>
:root{
  --bg:#f7f8fa; --card:#fff; --text:#1a1d23; --sub:#666d78; --border:#e4e7eb;
  --accent:#2f6feb; --accent-bg:#eaf1ff; --best:#0f9d58; --best-bg:#e6f7ee;
  --danger:#c0392b;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --card:#1d2025; --text:#eef0f3; --sub:#9aa2ad; --border:#2c3036;
    --accent:#5b8cff; --accent-bg:#1c2740; --best:#3ddc84; --best-bg:#123324;
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --card:#1d2025; --text:#eef0f3; --sub:#9aa2ad; --border:#2c3036;
  --accent:#5b8cff; --accent-bg:#1c2740; --best:#3ddc84; --best-bg:#123324;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;min-height:100%;}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px;}
h1{font-size:1.3rem;margin:4px 0 2px;}
.sub{color:var(--sub);font-size:.85rem;margin-bottom:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.field{flex:1;min-width:160px;}
label{display:block;font-size:.78rem;color:var(--sub);margin-bottom:6px;}
select,input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.95rem;}
button{cursor:pointer;border:none;border-radius:10px;padding:10px 16px;font-size:.9rem;font-weight:600;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-ghost{background:transparent;color:var(--sub);border:1px solid var(--border);}
.status{font-size:.8rem;color:var(--sub);margin-top:10px;}
.status.err{color:var(--danger);}
table{width:100%;border-collapse:collapse;font-size:.9rem;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);}
th{color:var(--sub);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.02em;}
.tablewrap{overflow-x:auto;}
tr.best{background:var(--best-bg);}
tr.best td:first-child{font-weight:700;color:var(--best);}
.badge{display:inline-block;font-size:.7rem;background:var(--best);color:#fff;border-radius:20px;padding:2px 8px;margin-left:6px;}
.na{color:var(--sub);}
details{margin-top:14px;}
summary{cursor:pointer;color:var(--sub);font-size:.8rem;}
pre{white-space:pre-wrap;font-size:.72rem;background:var(--bg);padding:10px;border-radius:8px;max-height:260px;overflow:auto;}
.empty{color:var(--sub);text-align:center;padding:30px 0;font-size:.9rem;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📦 해외배송 요금 비교</h1>
  <div class="sub">국가와 무게를 선택하면 K-Packet · Small Packet · Package · EMS · FedEx 요금을 비교합니다. (Google Sheets 실시간 연동)</div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>국가</label>
        <select id="country"><option>불러오는 중...</option></select>
      </div>
      <div class="field" style="max-width:140px;">
        <label>무게 (kg)</label>
        <select id="weight"></select>
      </div>
      <div>
        <button class="btn-primary" id="compareBtn">비교하기</button>
      </div>
      <div>
        <button class="btn-ghost" id="refreshBtn">↻ 시트 새로고침</button>
      </div>
      <div>
        <button class="btn-ghost" id="demoBtn">🧪 데모 데이터로 보기</button>
      </div>
    </div>
    <div class="status" id="status">시트 데이터를 불러오는 중...</div>
    <div class="status err" id="fileWarning" style="display:none;">⚠ 이 페이지를 file://로 직접 열면 브라우저가 Google Sheets 요청을 차단합니다. 로컬 서버나 웹 호스팅에 올려서 http(s)://로 열어주세요 (아래 안내 참고).</div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div class="tablewrap">
      <table>
        <thead><tr><th>배송 옵션</th><th>금액</th><th>적용 무게구간</th></tr></thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>

  <details>
    <summary>⚙ 데이터 확인 / 디버그</summary>
    <pre id="debug">-</pre>
  </details>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
const SSID = '1MXQKy6Br363xvS47-cYwZNPGn0PnyYERdb_TugM0RGc';
const SHEETS = {
  region: 'Post Region',
  rincos: 'rincos',
  kpacket: 'K-packet',
  small: '우체국요금',
  package: 'Package-KRW',
  ems: 'EMS-KRW',
  fedex: 'Fedex',
  fedexZone: 'Fedex Zone'
};
const CACHE_KEY = 'shipcmp_cache_v1';
let DATA = null;
let lastFedexCheck = null;
let lastPackageCheck = null;
let lastEmsCheck = null;

function csvUrl(name){
  return `https://docs.google.com/spreadsheets/d/${SSID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
}
async function fetchRows(name){
  let res;
  try{
    res = await fetch(csvUrl(name));
  }catch(networkErr){
    if(location.protocol==='file:'){
      throw new Error(`"${name}" 요청 실패: 이 파일을 "file://"로 직접 열어서 브라우저가 요청을 차단했습니다. 아래 안내대로 로컬 서버나 웹 호스팅(GitHub Pages 등)에 올려서 http(s):// 주소로 열어주세요.`);
    }
    throw new Error(`"${name}" 요청 중 네트워크 오류(CORS 등): ${networkErr.message}`);
  }
  if(!res.ok) throw new Error(`"${name}" 시트를 불러올 수 없습니다 (HTTP ${res.status}). 시트 이름이 정확히 일치하는지, 공유 설정이 "링크가 있는 모든 사용자(뷰어)"인지 확인해주세요.`);
  const text = await res.text();
  if(text.trim().startsWith('<')) throw new Error(`"${name}" 응답이 CSV가 아니라 로그인/오류 페이지입니다. 시트 공유 설정을 확인해주세요.`);
  return Papa.parse(text.trim(), {skipEmptyLines:false}).data;
}
const num = v => { const n = parseFloat(String(v??'').replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; };
const clean = v => (v??'').toString().normalize('NFC').replace(/[\u200B-\u200D\uFEFF\u00A0]/g,'').trim();

function parseRegion(rows){
  const out=[];
  rows.forEach((r,i)=>{
    const kr=clean(r[0]);
    if(!kr) return;
    if(i===0 && (kr.includes('국가')||kr.toLowerCase().includes('country'))) return;
    out.push({kr, code:clean(r[1]).toUpperCase(), en:clean(r[2]), region:clean(r[3])});
  });
  out.sort((a,b)=>a.kr.localeCompare(b.kr,'ko'));
  return out;
}
// generic weight-keyed table: headerRowIdx -> col names; weightColIdx defaults 0
function detectUnit(dataRows, weightColIdx){
  const vals = dataRows.map(r=>num(r[weightColIdx])).filter(v=>v!==null && v>0);
  if(!vals.length) return 'kg';
  return Math.min(...vals) > 30 ? 'g' : 'kg'; // e.g. 100,200,500... => grams; 0.1,0.5,1,2... => kg
}
function parseWeightTable(rows, headerRowIdx=0, weightColIdx=0, filterFn=null){
  const header = rows[headerRowIdx]||[];
  const cols = header.map(clean);
  let dataRows = rows.slice(headerRowIdx+1).filter(r=>r && num(r[weightColIdx])!==null);
  if(filterFn) dataRows = rows.slice(headerRowIdx+1).filter(r=>r && filterFn(r) && num(r[weightColIdx])!==null);
  const unit = detectUnit(dataRows, weightColIdx);
  return {cols, dataRows, weightColIdx, unit};
}
function lookupPrice(table, weightKg, colKey){
  const idx = table.cols.findIndex(c=>c===colKey);
  if(idx<0) return null;
  const target = table.unit==='g' ? weightKg*1000 : weightKg;
  let best=null;
  for(const r of table.dataRows){
    const w = num(r[table.weightColIdx]);
    if(w===null || w < target - 1e-6) continue;
    if(!best || w<best.w) best = {w, raw:r[idx]};
  }
  if(!best) return null;
  const price = num(best.raw);
  if(price===null) return null;
  return {price, weight: table.unit==='g' ? best.w/1000 : best.w};
}
function lookupPriceByIndex(table, weightKg, colIdx){
  const target = table.unit==='g' ? weightKg*1000 : weightKg;
  let best=null;
  for(const r of table.dataRows){
    const w = num(r[table.weightColIdx]);
    if(w===null || w < target - 1e-6) continue;
    if(!best || w<best.w) best = {w, raw:r[colIdx]};
  }
  if(!best) return null;
  const price = num(best.raw);
  if(price===null) return null;
  return {price, weight: table.unit==='g' ? best.w/1000 : best.w};
}
function lookupFedexPrice(fedexRaw, weightKg, zone){
  const zoneNorm = clean(zone).toUpperCase();
  const firstToken = s => (clean(s).split(/\s+/)[0]||'').toUpperCase();
  let headerRowIdx=-1, colIdx=-1;
  for(let ri=0; ri<Math.min(6, fedexRaw.length); ri++){
    const row = fedexRaw[ri]||[];
    const ci = row.findIndex(c=>firstToken(c)===zoneNorm);
    if(ci>=0){ headerRowIdx=ri; colIdx=ci; break; }
  }
  const first6rows = fedexRaw.slice(0,6);
  if(headerRowIdx<0) return {result:null, debug:{zoneNorm, headerRowIdx, colIdx, note:'zone letter not found as the first token of any cell in the first 6 rows', first6rows}};
  const dataRows = fedexRaw.slice(headerRowIdx+1).filter(r=>r && num(r[0])!==null);
  const unit = detectUnit(dataRows, 0);
  const target = unit==='g' ? weightKg*1000 : weightKg;
  let best=null;
  for(const r of dataRows){
    const w = num(r[0]);
    if(w===null || w < target - 1e-6) continue;
    if(!best || w<best.w) best = {w, raw:r[colIdx]};
  }
  if(!best) return {result:null, debug:{zoneNorm, headerRowIdx, colIdx, unit, note:'no weight row in column A >= target weight', sample_col_a: dataRows.slice(0,5).map(r=>r[0])}};
  const price = num(best.raw);
  const result = price===null ? null : {price, weight: unit==='g' ? best.w/1000 : best.w};
  return {result, debug:{zoneNorm, headerRowIdx, colIdx, unit, matched_weight_row:best.w, raw_price_cell:best.raw}};
}
// The header row's Korean text comes back blank from the CSV fetch (likely formula cells
// that don't evaluate for anonymous export), while literal numbers survive. Confirmed order
// from the actual sheet, used to match by position instead of by (unreliable) fetched text.
const PACKAGE_HEADER_ORDER = ['호주','브라질','캐나다','중국','프랑스','독일','홍콩','인도네시아','일본','말레이시아','뉴질랜드','필리핀','러시아','싱가포르','스페인','대만','태국','영국','미국','베트남','1','2','3','4'];
function packageColIndexFor(key){
  if(!key) return -1;
  const pos = PACKAGE_HEADER_ORDER.indexOf(key);
  return pos<0 ? -1 : pos+1; // +1: column A is weight
}
function lookupEmsPrice(emsRaw, weightKg, key){
  const headerRow = (emsRaw[0]||[]).map(clean);
  const colIdx = headerRow.findIndex(c=>c===key);
  if(colIdx<0) return {result:null, debug:{key, colIdx, note:'헤더 행(우리가 직접 가져온 데이터)에서 해당 텍스트를 찾지 못함', header_row:headerRow}};
  const dataRows = emsRaw.slice(1).filter(r=>r && num(r[0])!==null);
  const unit = detectUnit(dataRows, 0);
  const target = unit==='g' ? weightKg*1000 : weightKg;
  let best=null;
  for(const r of dataRows){
    const w = num(r[0]);
    if(w===null || w < target - 1e-6) continue;
    if(!best || w<best.w) best = {w, raw:r[colIdx]};
  }
  if(!best) return {result:null, debug:{key, colIdx, unit, note:'컬럼 A에 조건을 만족하는 무게 행 없음'}};
  const price = num(best.raw);
  const result = price===null ? null : {price, weight: unit==='g' ? best.w/1000 : best.w};
  return {result, debug:{key, colIdx, unit, matched_weight_row:best.w, raw_price_cell:best.raw}};
}
function findCellLocations(rows, target, maxRows=20){
  const targetC = clean(target);
  if(!targetC) return [];
  const hits = [];
  for(let ri=0; ri<Math.min(maxRows, rows.length); ri++){
    const row = rows[ri]||[];
    for(let ci=0; ci<row.length; ci++){
      const v = clean(row[ci]);
      if(v && (v===targetC || v.includes(targetC))){
        hits.push({row:ri, col:ci, value:v, exact:v===targetC});
      }
    }
  }
  return hits;
}
function findFedexZone(zoneRows, country){
  let zoneColIdx = -1;
  for(let ci=0; ci<(zoneRows[0]||[]).length; ci++){
    // scan a few header-ish rows for a "zone" label
    for(let ri=0; ri<Math.min(3,zoneRows.length); ri++){
      const v = clean(zoneRows[ri][ci]).toLowerCase();
      if(v.includes('zone')||v.includes('존')||v.includes('구역')) zoneColIdx = ci;
    }
  }
  for(const r of zoneRows){
    const cells = r.map(clean);
    if(cells.includes(country.kr) || (country.en && cells.some(c=>c.toLowerCase()===country.en.toLowerCase()))){
      if(zoneColIdx>=0 && r[zoneColIdx]) return clean(r[zoneColIdx]);
      const last = [...r].reverse().find(c=>clean(c));
      if(last) return clean(last);
    }
  }
  return null;
}

async function loadAll(){
  const status = document.getElementById('status');
  status.className='status'; status.textContent='시트 데이터를 불러오는 중...';
  try{
    const [regionRaw, rincosRaw, kpRaw, smallRaw, pkgRaw, emsRaw, fedexRaw, fedexZoneRaw] = await Promise.all(
      Object.values(SHEETS).map(fetchRows)
    );
    const countries = parseRegion(regionRaw);
    const rincos = parseWeightTable(rincosRaw, 0, 0);
    const kpacket = parseWeightTable(kpRaw, 0, 0);
    const small = parseWeightTable(smallRaw, 0, 1, r => clean(r[0]).includes('소형포장물'));
    const pkg = parseWeightTable(pkgRaw, 0, 0);
    const pkgRawPreview = pkgRaw.slice(0,3);
    const pkgRawFull = pkgRaw;
    const ems = parseWeightTable(emsRaw, 0, 0);
    const emsRawFull = emsRaw;
    const fedex = fedexRaw;
    DATA = {countries, rincos, kpacket, small, pkg, pkgRawPreview, pkgRawFull, ems, emsRawFull, fedex, fedexZoneRaw};
    localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), regionRaw,rincosRaw,kpRaw,smallRaw,pkgRaw,emsRaw,fedexRaw,fedexZoneRaw}));
    populateCountries(countries);
    status.textContent = `데이터 로드 완료 · ${countries.length}개국 · ${new Date().toLocaleTimeString('ko-KR')}`;
    renderDebug();
  }catch(e){
    status.className='status err';
    status.textContent = '오류: '+e.message+' — 위 "🧪 데모 데이터로 보기" 버튼으로 화면 미리보기를 확인할 수 있습니다.';
    const cached = localStorage.getItem(CACHE_KEY);
    if(cached && !DATA){
      const c = JSON.parse(cached);
      const countries = parseRegion(c.regionRaw);
      DATA = {
        countries,
        rincos: parseWeightTable(c.rincosRaw,0,0),
        kpacket: parseWeightTable(c.kpRaw,0,0),
        small: parseWeightTable(c.smallRaw,0,1,r=>clean(r[0]).includes('소형포장물')),
        pkg: parseWeightTable(c.pkgRaw,0,0),
        pkgRawPreview: c.pkgRaw.slice(0,3),
        pkgRawFull: c.pkgRaw,
        ems: parseWeightTable(c.emsRaw,0,0),
        emsRawFull: c.emsRaw,
        fedex: c.fedexRaw,
        fedexZoneRaw: c.fedexZoneRaw
      };
      populateCountries(countries);
      status.textContent += ` (캐시: ${new Date(c.t).toLocaleString('ko-KR')})`;
    }
  }
}
function countryLabel(c){ return c.en ? `${c.en} (${c.kr})` : c.kr; }
function populateCountries(countries){
  const sorted = [...countries].sort((a,b)=>(a.en||a.kr).localeCompare(b.en||b.kr));
  const priority = sorted.filter(c=>['US','CA'].includes(c.code) || ['UNITED STATES','CANADA'].includes((c.en||'').toUpperCase()));
  const rest = sorted.filter(c=>!priority.includes(c));
  const ordered = [...priority, ...rest];
  const sel = document.getElementById('country');
  sel.innerHTML = ordered.map(c=>`<option value="${c.kr}">${countryLabel(c)}</option>`).join('');
}
function findCountryByInput(){
  const val = document.getElementById('country').value;
  return DATA.countries.find(c=>c.kr===val);
}
function generateWeightOptions(){
  const w = [];
  for(let v=0.1; v<=1.0+1e-9; v+=0.1) w.push(+v.toFixed(1));
  for(let v=1.5; v<=5.0+1e-9; v+=0.5) w.push(+v.toFixed(1));
  for(let v=6; v<=10; v+=1) w.push(v);
  [12,15,20,25,30].forEach(v=>w.push(v));
  return w;
}
function populateWeights(){
  const sel = document.getElementById('weight');
  sel.innerHTML = generateWeightOptions().map(v=>`<option value="${v}">${v}kg</option>`).join('');
  sel.value = '0.5';
}
populateWeights();
function renderDebug(){
  document.getElementById('debug').textContent = JSON.stringify({
    countries: DATA.countries.length,
    rincos: {unit:DATA.rincos.unit, rows:DATA.rincos.dataRows.length},
    kpacket: {unit:DATA.kpacket.unit, cols:DATA.kpacket.cols.slice(0,6)},
    small: {unit:DATA.small.unit, cols:DATA.small.cols.slice(0,6), rows_filtered:DATA.small.dataRows.length},
    pkg: {unit:DATA.pkg.unit, cols:DATA.pkg.cols.slice(0,6)},
    ems: {unit:DATA.ems.unit, cols:DATA.ems.cols.slice(0,6)},
    fedex_raw_preview: DATA.fedex.slice(0,6),
    last_fedex_check: lastFedexCheck,
    last_package_check: lastPackageCheck,
    last_ems_check: lastEmsCheck
  }, null, 2);
}

function compare(){
  if(!DATA) return;
  const weight = num(document.getElementById('weight').value) || 0.1;
  const country = findCountryByInput();
  if(!country) return;

  const results = [];
  const isUS = country.code==='US' || (country.en||'').toUpperCase()==='UNITED STATES';
  if(isUS){
    const rc = lookupPriceByIndex(DATA.rincos, weight, 1);
    results.push({name:'Rincos', r:rc});
  }
  const kp = lookupPrice(DATA.kpacket, weight, country.kr);
  results.push({name:'K-Packet', r:kp});

  let sm = null;
  if(country.code==='US' || (country.en||'').toUpperCase()==='UNITED STATES'){
    sm = lookupPrice(DATA.small, weight, 'US') || lookupPrice(DATA.small, weight, country.region);
  } else {
    sm = lookupPrice(DATA.small, weight, country.region);
  }
  results.push({name:'Small Packet (소형포장물)', r:sm});

  const pkgKrIdx = packageColIndexFor(country.kr);
  const pkgRegionIdx = packageColIndexFor(country.region);
  const pkg = pkgKrIdx>=0 ? lookupPriceByIndex(DATA.pkg, weight, pkgKrIdx)
            : pkgRegionIdx>=0 ? lookupPriceByIndex(DATA.pkg, weight, pkgRegionIdx)
            : null;
  results.push({name:'Package', r:pkg});
  lastPackageCheck = {
    country_kr: country.kr,
    country_region: country.region,
    matched_via: pkgKrIdx>=0 ? `국가명 매칭 (위치 기반, index ${pkgKrIdx})` : (pkgRegionIdx>=0 ? `지역코드 매칭 (위치 기반, index ${pkgRegionIdx})` : '매칭 실패'),
    unit: DATA.pkg.unit,
    result: pkg,
    country_name_search_result: findCellLocations(DATA.pkgRawFull, country.kr, 20)
  };

  const emsKrResult = lookupEmsPrice(DATA.emsRawFull, weight, country.kr);
  const emsRegionResult = (!emsKrResult.result && country.region) ? lookupEmsPrice(DATA.emsRawFull, weight, country.region) : null;
  const ems = emsKrResult.result || (emsRegionResult && emsRegionResult.result);
  results.push({name:'EMS', r:ems});
  lastEmsCheck = {
    country_kr: country.kr,
    country_region: country.region,
    kr_attempt: emsKrResult.debug,
    region_attempt: emsRegionResult ? emsRegionResult.debug : 'not attempted (국가명 매칭 성공 또는 지역코드 없음)'
  };

  const zone = findFedexZone(DATA.fedexZoneRaw, country);
  const fxLookup = zone ? lookupFedexPrice(DATA.fedex, weight, zone) : null;
  const fx = fxLookup ? fxLookup.result : null;
  results.push({name:'FedEx'+(zone?` (Zone ${zone})`:''), r:fx});
  lastFedexCheck = {
    country: country.kr,
    zone_found: zone,
    lookup_debug: fxLookup ? fxLookup.debug : 'no zone found, lookup not attempted'
  };
  renderDebug();

  const valid = results.filter(x=>x.r);
  const minPrice = valid.length ? Math.min(...valid.map(x=>x.r.price)) : null;

  const body = document.getElementById('resultBody');
  document.getElementById('resultCard').style.display='block';
  if(!valid.length){
    body.innerHTML = `<tr><td colspan="3" class="empty">이 국가에 대한 요금 데이터를 찾지 못했습니다. 디버그 패널을 확인해주세요.</td></tr>`;
    return;
  }
  body.innerHTML = results.map(x=>{
    if(!x.r) return `<tr><td>${x.name}</td><td class="na" colspan="2">N/A</td></tr>`;
    const isBest = x.r.price===minPrice;
    return `<tr class="${isBest?'best':''}"><td>${x.name}${isBest?'<span class="badge">최저가</span>':''}</td><td>${x.r.price.toLocaleString('ko-KR')}원</td><td>${x.r.weight}kg 구간</td></tr>`;
  }).join('');
}

document.getElementById('compareBtn').onclick = compare;
document.getElementById('refreshBtn').onclick = loadAll;
